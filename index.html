<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thư viện ảnh tương tác</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    img {
      width: 200px;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 5px;
    }
    img:focus {
      outline: 3px solid blue;
    }
  </style>
</head>
<body onload="initGallery()">
  <h1>Thư viện ảnh tương tác</h1>
  <div class="gallery" id="gallery">
    <img src="./images/img1.jpg" alt="Hình ảnh phong cảnh núi" />
    <img src="./images/img2.jpg" alt="Hình ảnh bãi biển hoàng hôn" />
    <img src="./images/img3.jpg" alt="Hình ảnh thành phố ban đêm" />
    <img src="./images/img4.jpg" alt="Hình ảnh rừng xanh mát" />
    <img src="./images/img5.jpg" alt="Hình ảnh hồ nước trong vắt" />
    <img src="./images/home.jpg" alt="Hình ảnh cánh đồng hoa" />
  </div>

  <script>
    function initGallery() {
      console.log("Trang đã tải xong - initGallery được gọi");
      const images = document.querySelectorAll("#gallery img");

      for (let i = 0; i < images.length; i++) {
        const img = images[i];

        // Thêm tabindex để có thể tab tới hình ảnh
        img.setAttribute("tabindex", "0");

        // Sự kiện khi chuột vào
        img.addEventListener("mouseover", function () {
          img.style.border = "2px solid green";
          console.log(`mouseover vào ảnh ${i + 1}`);
        });

        // Sự kiện khi chuột rời đi
        img.addEventListener("mouseleave", function () {
          img.style.border = "2px solid #ccc";
          console.log(`mouseleave khỏi ảnh ${i + 1}`);
        });

        // Sự kiện khi focus bằng bàn phím (tab)
        img.addEventListener("focus", function () {
          img.style.border = "2px solid blue";
          console.log(`focus vào ảnh ${i + 1}`);
        });

        // Sự kiện khi mất focus
        img.addEventListener("blur", function () {
          img.style.border = "2px solid #ccc";
          console.log(`blur khỏi ảnh ${i + 1}`);
        });
      }
    }
  </script>
</body>
</html>
